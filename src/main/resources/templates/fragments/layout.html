<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | SportKids'">SportKids</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<nav th:fragment="navbar" class="sk-nav">
    <div class="container">
        <a class="sk-logo" th:href="@{/}" title="SportKids - página inicial">SK</a>

        <div sec:authorize="!isAuthenticated()">
            <a class="btn btn-sportkids btn-sm" th:href="@{/login}">Acessar painel</a>
        </div>

        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
            <a class="sk-nav-link" th:href="@{/app/brinquedos}">Brinquedos</a>
            <a class="sk-nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/h2-console}">Console H2</a>
            <span class="sk-usuario">
                <span sec:authentication="name">usuario</span>
                <span class="sk-perfil" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="sk-perfil" sec:authorize="!hasRole('ADMIN')">USER</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-contorno-claro btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success mb-4" role="alert" th:text="${sucesso}"></div>
</div>

<footer th:fragment="rodape" class="sk-rodape">
    SportKids · Brinquedos esportivos para crianças de até 15 anos · AC4 Ibmec
</footer>

</body>
</html>
<!--/*
RESUMO: Este arquivo nao e uma pagina acessada diretamente: ele e uma biblioteca de FRAGMENTOS Thymeleaf
reaproveitados por todas as telas (th:fragment). O fragmento "head" monta o cabecalho HTML com o titulo da
pagina, o Bootstrap via CDN (protegido por integrity/SRI) e o CSS proprio do projeto; "navbar" e a barra
superior translucida com o logo "SK" da marca, que usa os atributos sec:authorize e sec:authentication
(Thymeleaf Extras Spring Security) para mostrar ao visitante o botao "Acessar painel" (o acesso especifico
que chama a tela de login) ou, para quem esta logado, os links da area restrita, o nome do usuario com o
seu perfil (USER/ADMIN), o link do console H2 apenas ao ADMIN e o botao de logout via POST com token CSRF;
"mensagens" exibe avisos de sucesso; e "rodape" e o rodape comum. Centralizar esses trechos evita
duplicacao e facilita a manutencao: alterou aqui, muda em todas as paginas. Este comentario usa a sintaxe
de comentario do Thymeleaf e por isso nao e enviado ao navegador.
*/-->
