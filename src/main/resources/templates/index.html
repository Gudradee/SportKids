<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Início')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 py-md-5">
    <section class="sk-hero mb-5">
        <h1 class="sk-hero-titulo">SportKids</h1>
        <p class="sk-hero-subtitulo">Brinquedos esportivos para crianças de até 15 anos.</p>
        <span class="sk-pilula">
            <strong th:text="${total}">0</strong> produtos no catálogo
        </span>
    </section>

    <section th:unless="${#lists.isEmpty(destaques)}">
        <h2 class="sk-secao-titulo">Destaques</h2>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="b : ${destaques}">
                <article class="sk-card-produto">
                    <div class="sk-card-imagem" aria-hidden="true">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="4"/>
                            <circle cx="8.5" cy="8.5" r="1.6"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                    </div>
                    <div class="sk-card-corpo">
                        <span class="sk-tag" th:text="${b.tipo()}">Tipo</span>
                        <h3 class="sk-card-nome" th:text="${b.nome()}">Nome</h3>
                        <p class="sk-card-idade"
                           th:text="'Indicado a partir de ' + ${b.classificacao()} + ' anos'">Idade</p>
                        <p class="sk-card-preco mb-0"
                           th:text="'R$ ' + ${#numbers.formatDecimal(b.preco(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                    </div>
                </article>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
<!--/*
RESUMO: Esta e a LANDING PAGE publica da loja (rota "/"), acessivel sem login. Ela reaproveita o cabecalho,
a barra superior (com o logo "SK" e o botao "Acessar painel", que e o acesso especifico a tela de login) e o
rodape do arquivo fragments/layout.html via th:replace. O banner principal mostra o nome SportKids em
destaque, o subtitulo com o publico da empresa (criancas de ate 15 anos) e a quantidade de produtos
cadastrados (variavel ${total} enviada pelo WebController). Abaixo, a secao "Destaques" percorre com
th:each ate tres produtos e monta um card arredondado para cada um, com um icone no lugar da foto, o tipo,
o nome, a idade indicada e o preco formatado no padrao brasileiro pelo utilitario #numbers do Thymeleaf.
*/-->
