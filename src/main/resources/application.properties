spring.application.name=brinquedos
server.port=8080

spring.datasource.url=jdbc:h2:mem:brinquedosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.thymeleaf.cache=false

server.error.include-stacktrace=never
server.error.include-message=never

app.seguranca.usuario.username=user
app.seguranca.usuario.senha=${APP_USER_PASSWORD:user123}
app.seguranca.admin.username=admin
app.seguranca.admin.senha=${APP_ADMIN_PASSWORD:admin123}

# RESUMO: Este arquivo centraliza a configuracao da aplicacao Spring Boot. Ele define a porta 8080 do
# Tomcat embutido, a conexao com o banco H2 em memoria (brinquedosdb), o comportamento do JPA/Hibernate
# (criacao automatica da tabela TDS_TB_Brinquedos a partir da entidade e exibicao do SQL no console),
# habilita o console web do H2 em /h2-console, desliga o cache do Thymeleaf para desenvolvimento,
# impede que detalhes internos de erros vazem nas respostas e declara os usuarios "user" e "admin"
# usados pelo Spring Security, cujas senhas podem ser sobrescritas por variaveis de ambiente para que
# credenciais reais nunca precisem ficar gravadas no codigo-fonte.
